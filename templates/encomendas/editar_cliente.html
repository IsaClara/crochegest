{% extends 'encomendas/base.html' %}

{% block title %}Editar Cliente - CrochêGest{% endblock %}

{% block content %}

<div class="form-page">


<div class="page-header">
    <div>
        <h2>Editar cliente</h2>
        <p>Altere os dados do cliente.</p>
    </div>
</div>

<div class="form-container">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="nome">Nome:</label>

            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ cliente.nome }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="telefone">Telefone:</label>

            <input
                type="text"
                id="telefone"
                name="telefone"
                value="{{ cliente.telefone }}"
                required
            >
        </div>

        <div class="form-actions">

            <a
                class="btn btn-secondary"
                href="{% url 'listar_clientes' %}"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Salvar alterações
            </button>

        </div>

    </form>

</div>


</div>

{% endblock %}
