{% extends 'encomendas/base.html' %}

{% block title %}Cadastrar Encomenda - CrochêGest{% endblock %}

{% block content %}

<div class="form-page">

<div class="page-header">
    <div>
        <h2>Nova encomenda</h2>
        <p>Cadastre uma nova encomenda de crochê.</p>
    </div>
</div>

<div class="form-container">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="cliente">Cliente:</label>

            <select
                id="cliente"
                name="cliente"
                required
            >

                <option value="">
                    Selecione um cliente
                </option>

                {% for cliente in clientes %}

                    <option value="{{ cliente.id }}">
                        {{ cliente.nome }}
                    </option>

                {% endfor %}

            </select>
        </div>


        <div class="form-group">
            <label for="produto">Produto:</label>

            <input
                type="text"
                id="produto"
                name="produto"
                required
            >
        </div>


        <div class="form-group">
            <label for="cor">Cor:</label>

            <input
                type="text"
                id="cor"
                name="cor"
                required
            >
        </div>


        <div class="form-group">
            <label for="data_entrega">Data de entrega:</label>

            <input
                type="datetime-local"
                id="data_entrega"
                name="data_entrega"
                required
            >
        </div>


        <div class="form-group">
            <label for="valor">Valor:</label>

            <input
                type="number"
                id="valor"
                name="valor"
                step="0.01"
                required
            >
        </div>


        <div class="form-group">
            <label for="status">Status:</label>

            <select
                id="status"
                name="status"
                required
            >

                {% for codigo, nome in status_choices %}

                    <option value="{{ codigo }}">
                        {{ nome }}
                    </option>

                {% endfor %}

            </select>
        </div>


        <div class="form-actions">

            <a
                class="btn btn-secondary"
                href="{% url 'listar_encomendas' %}"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Cadastrar encomenda
            </button>

        </div>

    </form>

</div>

</div>

{% endblock %}
