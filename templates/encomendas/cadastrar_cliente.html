{% extends 'encomendas/base.html' %}

{% block title %}Cadastrar Cliente - CrochêGest{% endblock %}

{% block content %}

<div class="form-page">


<div class="page-header">
    <div>
        <h2>Novo cliente</h2>
        <p>Cadastre um novo cliente no CrochêGest.</p>
    </div>
</div>

<div class="form-container">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="nome">Nome:</label>

            <input
                type="text"
                id="nome"
                name="nome"
                required
            >
        </div>

        <div class="form-group">
            <label for="telefone">Telefone:</label>

            <input
                type="text"
                id="telefone"
                name="telefone"
                required
            >
        </div>

        <div class="form-actions">

            <a
                class="btn btn-secondary"
                href="{% url 'listar_clientes' %}"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Cadastrar cliente
            </button>

        </div>

    </form>

</div>

</div>

{% endblock %}
